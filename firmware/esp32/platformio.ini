; ESP32-S3 (U9, WROOM-1-N8R2) firmware draft: link to the FPGA sensor hub, Wi-Fi status page, SD logging, beeps.
;   pio run                 build
;   pio run -t upload       flash over the USB-C port (native USB)
[env:fcl]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 8MB
build_flags =
    -I../common
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<*> +<../../common/link.c>
monitor_speed = 115200
